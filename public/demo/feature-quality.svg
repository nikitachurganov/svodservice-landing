<svg width="694" height="617" viewBox="0 -26 694 617" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Анкета — акцент; правый нижний угол уходит под стеклянный щит и размывается -->
  <g id="back">
    <rect x="150" y="20" width="320" height="420" rx="40" fill="#FD6A12"/>
    <rect x="204" y="96" width="180" height="36" rx="18" fill="white"/>
    <rect x="204" y="166" width="220" height="36" rx="18" fill="white"/>
    <rect x="204" y="236" width="140" height="36" rx="18" fill="white"/>
    <rect x="204" y="306" width="190" height="36" rx="18" fill="white"/>
  </g>
  <path id="shield" d="M470 180C522 216 580 232 620 232V350C620 450 556 516 470 546C384 516 320 450 320 350V232C360 232 418 216 470 180Z"/>
  <clipPath id="glass">
    <use href="#shield"/>
  </clipPath>
  <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff" stop-opacity=".9"/>
    <stop offset=".4" stop-color="#fff" stop-opacity=".15"/>
    <stop offset=".75" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
  </linearGradient>
</defs>

<!-- Приглушённый лист сзади -->
<rect x="56" y="60" width="300" height="400" rx="40" fill="#FEC3A0" fill-opacity="0.7" transform="rotate(-8 206 260)"/>

<use href="#back"/>

<!-- Стеклянный щит: под ним анкета размыта, сверху тонировка и блик по кромке -->
<g clip-path="url(#glass)">
  <rect x="320" y="180" width="300" height="366" fill="#F5F5F5"/>
  <use href="#back" filter="url(#frost)"/>
  <rect x="320" y="180" width="300" height="366" fill="#FD6A12" fill-opacity="0.33"/>
</g>
<use href="#shield" stroke="url(#rim)" stroke-width="4"/>

<!-- Галочка на щите -->
<path d="M410 366L455 410L534 326" stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
