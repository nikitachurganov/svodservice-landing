<svg width="694" height="617" viewBox="0 12 694 617" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Столбики графика: акцентный только самый высокий, остальные приглушены -->
  <g id="back">
    <rect x="40" y="260" width="120" height="300" rx="30" fill="#FEC3A0" fill-opacity="0.7"/>
    <rect x="190" y="170" width="120" height="390" rx="30" fill="#FCAA79" fill-opacity="0.6"/>
    <rect x="340" y="60" width="120" height="500" rx="30" fill="#FD6A12"/>
  </g>
  <!-- Пузырь ИИ-чата с хвостиком -->
  <path id="bubble" d="M340 300H600Q660 300 660 360V460Q660 520 600 520H390L310 580L325 505Q280 490 280 440V360Q280 300 340 300Z"/>
  <clipPath id="glass">
    <use href="#bubble"/>
  </clipPath>
  <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff" stop-opacity=".9"/>
    <stop offset=".4" stop-color="#fff" stop-opacity=".15"/>
    <stop offset=".75" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
  </linearGradient>
</defs>

<use href="#back"/>

<!-- Стеклянный пузырь: под ним график размыт, сверху тонировка и блик по кромке -->
<g clip-path="url(#glass)">
  <rect x="280" y="300" width="380" height="280" fill="#F5F5F5"/>
  <use href="#back" filter="url(#frost)"/>
  <rect x="280" y="300" width="380" height="280" fill="#FD6A12" fill-opacity="0.33"/>
</g>
<use href="#bubble" stroke="url(#rim)" stroke-width="4"/>

<!-- Ответ ИИ: строки и искра -->
<rect x="330" y="356" width="200" height="40" rx="20" fill="white"/>
<rect x="330" y="424" width="140" height="40" rx="20" fill="white"/>
<path d="M600 366C604 392 610 398 636 402C610 406 604 412 600 438C596 412 590 406 564 402C590 398 596 392 600 366Z" fill="white"/>
</svg>
