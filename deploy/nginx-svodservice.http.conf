# Лендинг svodservice.ru, только HTTP. Нужен для первого выпуска сертификата:
# отдаёт challenge Let's Encrypt и сам лендинг. После выпуска сертификата
# переключитесь на nginx-svodservice.conf (см. раздел «Деплой» в README).

server {
    listen 80;
    server_name svodservice.ru www.svodservice.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
