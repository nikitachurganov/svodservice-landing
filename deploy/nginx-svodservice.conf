# Лендинг svodservice.ru, HTTPS. Подключается в nginx-контейнер основного сервиса
# как /etc/nginx/conf.d/landing.conf (см. раздел «Деплой» в README).
# Сертификат Let's Encrypt должен существовать до включения этого файла,
# иначе nginx не запустится: сначала используйте nginx-svodservice.http.conf.

server {
    listen 80;
    server_name svodservice.ru www.svodservice.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://svodservice.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.svodservice.ru;

    ssl_certificate /etc/letsencrypt/live/svodservice.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/svodservice.ru/privkey.pem;

    return 301 https://svodservice.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name svodservice.ru;

    ssl_certificate /etc/letsencrypt/live/svodservice.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/svodservice.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LANDING_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ИИ-демо: тот же origin, без CORS. Upstream svod_api объявлен в конфиге сервиса
    # (surveys.svodservice.ru.conf) в этом же nginx. Наружу открыт только демо-маршрут.
    location /api/public/demo/ {
        proxy_pass http://svod_api/public/demo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
